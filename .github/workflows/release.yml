name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for accurate changelog generation (git log
          # <previous>..HEAD). A shallow clone silently omits older commits.
          fetch-depth: 0

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: changed
        run: |
          git diff HEAD~1 HEAD -- package.json | grep -q '"version"' && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        if: steps.changed.outputs.changed == 'true'
        id: tag_check
        run: |
          git fetch --tags
          # Do not use git rev-parse on the bare tag name: a branch with the same
          # name would be resolved and incorrectly skip the release.
          if git show-ref --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: npm ci || npm install

      - name: Run tests
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: npm test

      - name: Generate changelog
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            LOGS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOGS=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD)
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo ""
            echo "$LOGS"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${{ steps.version.outputs.tag }}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
