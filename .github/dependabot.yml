version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Prisma 7 has no MongoDB support; stay on Prisma 6 until it does.
      - dependency-name: "prisma"
        versions: [">=7"]
      - dependency-name: "@prisma/client"
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
